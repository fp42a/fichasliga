<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Fichas de inscripción · La Liga Estudiantil</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">LE</span>
        <div>
          <p class="brand__eyebrow">La Liga Estudiantil · Fichas de inscripción</p>
          <h1 class="brand__title" id="titulo">Cargando…</h1>
        </div>
      </div>
      <p class="meta" id="meta" aria-live="polite"></p>
    </div>
  </header>

  <nav class="filtros wrap" id="filtros" aria-label="Filtrar por deporte" hidden></nav>

  <main class="wrap" id="contenido">
    <div class="estado" id="estado">
      <div class="spinner" aria-hidden="true"></div>
      <p>Cargando equipos…</p>
    </div>
  </main>

  <footer class="wrap pie">
    <p>Información tomada del registro oficial de inscripción. Si algo no coincide, comunícate con la organización de La Liga Estudiantil.</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <template id="tpl-equipo">
    <article class="equipo">
      <header class="equipo__head">
        <div>
          <h3 class="equipo__titulo"></h3>
          <p class="equipo__sub"></p>
        </div>
        <button type="button" class="btn btn--pdf">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Descargar PDF</span>
        </button>
      </header>
      <ul class="jugadores"></ul>
    </article>
  </template>

  <script src="/jspdf.umd.min.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
